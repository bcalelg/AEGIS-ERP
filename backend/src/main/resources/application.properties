spring.application.name=AEGIS-ERP
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${DB_USERNAME:AEGIS_ERP}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# Existing Oracle schema is authoritative; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${DB_USERNAME:AEGIS_ERP}
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
jwt.cookie.name=${AEGIS_COOKIE_NAME:AEGIS_ACCESS_TOKEN}
jwt.cookie.secure=${AEGIS_COOKIE_SECURE:false}
jwt.cookie.same-site=${AEGIS_COOKIE_SAME_SITE:Lax}
password-recovery.secret=${PASSWORD_RECOVERY_SECRET}
password-recovery.expiration-minutes=${PASSWORD_RECOVERY_EXPIRATION_MINUTES:15}
password-recovery.issuer=${PASSWORD_RECOVERY_ISSUER:aegis-erp-password-recovery}
password-recovery.request-cooldown-seconds=${PASSWORD_RECOVERY_COOLDOWN_SECONDS:60}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
